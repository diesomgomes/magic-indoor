plugins {
    id "com.android.application"
}

android {
    namespace "com.magicindor.player"
    compileSdk 36

    defaultConfig {
        applicationId "com.magicindor.player"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }
}

dependencies {
    // WebViewAssetLoader: serve o player.html local numa origem https:// real em vez de
    // file://, que o player do YouTube embutido rejeita (erro 153).
    implementation "androidx.webkit:webkit:1.12.1"
}
