<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Entrar | Magic Indoor</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

		:root {
			--ink: #101a2c; --muted: #64758c; --line: #d9e3f5; --paper: #f1f5fc; --white: #ffffff;
			--accent: #2f6fed; --accent-deep: #1d4ed8; --accent-warm: #6ec6ff; --accent-soft: #bfe3ff; --dark: #0d1b2a;
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; }
		body { margin: 0; background: var(--white); color: var(--ink); font-family: 'Manrope', sans-serif; }
		button, input { font: inherit; }
		button { cursor: pointer; }

		.screen { display: grid; grid-template-columns: minmax(360px, 460px) 1fr; min-height: 100vh; }
		.form-side { display: flex; align-items: center; justify-content: center; padding: 40px 32px; }
		.form-wrap { width: 100%; max-width: 340px; }
		.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.04em; font-size: 18px; margin-bottom: 34px; }
		.brand-mark { width: 30px; height: 30px; background: var(--accent); color: #fff; border-radius: 6px; display: grid; place-items: center; font-weight: 800; font-size: 13px; }

		h1 { font-size: 26px; letter-spacing: -.04em; margin: 0 0 8px; }
		.subtitle { color: var(--muted); font-size: 13px; margin: 0 0 26px; }
		.subtitle a { color: var(--accent-deep); font-weight: 700; text-decoration: none; }
		.subtitle a:hover { text-decoration: underline; }

		.field { display: grid; gap: 7px; margin-bottom: 15px; }
		.field label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
		.input-wrap { position: relative; }
		.field input { width: 100%; border: 1px solid var(--line); padding: 12px 13px; outline: none; font-size: 13px; background: var(--white); }
		.field input:focus { border-color: var(--accent); }
		.toggle-visibility { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px; }

		.row-between { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 22px; font-size: 12px; }
		.remember { display: flex; align-items: center; gap: 7px; color: var(--muted); }
		.row-between a { color: var(--accent-deep); text-decoration: none; font-weight: 600; }
		.row-between a:hover { text-decoration: underline; }

		.primary { width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 13px; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 9px; transition: background .15s, opacity .15s; }
		.primary:hover { background: var(--accent-deep); }
		.primary:disabled { opacity: .7; cursor: default; }

		.form-error { display: none; background: #fdecea; border: 1px solid #f1c2c2; color: #b3392f; font-size: 12px; padding: 10px 12px; border-radius: 5px; margin-bottom: 16px; }
		.form-error.visible { display: block; }
		.form-note { display: none; background: #eaf6ee; border: 1px solid #bfe3cb; color: #256a3e; font-size: 12px; padding: 10px 12px; border-radius: 5px; margin-bottom: 16px; }
		.form-note.visible { display: block; }
		.setup-note { font-size: 11px; color: var(--muted); text-align: center; margin-top: 22px; line-height: 1.6; }
		.setup-note a { color: var(--accent-deep); font-weight: 700; text-decoration: none; }

		.success-view { display: none; text-align: center; }
		.success-view.visible { display: block; }
		.success-icon { width: 56px; height: 56px; border-radius: 50%; background: #eaf6ee; color: #256a3e; display: grid; place-items: center; font-size: 26px; margin: 0 auto 20px; }
		.success-view h1 { font-size: 22px; }
		.success-view p { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 28px; }
		.success-view .primary { text-decoration: none; }

		.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite; display: none; }
		.primary.loading .spinner { display: inline-block; }
		.primary.loading .btn-label { opacity: .85; }
		@keyframes spin { to { transform: rotate(360deg); } }

		.hero-side { position: relative; overflow: hidden; background: #0d1b2a; }
		.carousel { position: absolute; inset: 0; }
		.carousel-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
		.carousel-slide.active { opacity: 1; }
		.carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
		.hero-glow { position: absolute; inset: 0; pointer-events: none; background:
			linear-gradient(180deg, rgba(13,27,42,.55) 0%, rgba(13,27,42,0) 30%, rgba(13,27,42,0) 55%, rgba(13,27,42,.85) 100%),
			radial-gradient(120% 60% at 50% 100%, rgba(79,143,240,.5) 0%, rgba(79,143,240,0) 70%); }
		.hero-top { position: absolute; top: 32px; right: 32px; z-index: 2; }
		.support-link { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: #eaf1fb; text-decoration: none; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); padding: 8px 14px; border-radius: 20px; backdrop-filter: blur(4px); }
		.carousel-dots { position: absolute; left: 0; right: 0; bottom: 28px; z-index: 2; display: flex; gap: 6px; justify-content: center; }
		.carousel-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.35); transition: width .2s, background .2s; }
		.carousel-dots span.active { background: var(--accent-warm); width: 18px; border-radius: 4px; }

		@media (max-width: 860px) {
			.screen { grid-template-columns: 1fr; }
			.hero-side { display: none; }
			.form-side { padding: 28px 20px; }
		}
	</style>
</head>
<body>
	<div class="screen">
		<section class="form-side">
			<div class="form-wrap">
				<div class="brand"><div class="brand-mark">MI</div><span>Magic Indoor</span></div>

				<div id="authView">
					<h1 id="formTitle">Entrar</h1>
					<p class="subtitle" id="formSubtitle">Não tem uma conta? <a href="#" id="toggleMode">Criar agora</a></p>

					<div class="form-error" id="formError"></div>
					<div class="form-note" id="formNote"></div>

					<form id="authForm">
						<div class="field" id="fieldName" style="display:none">
							<label for="name">Seu nome</label>
							<input id="name" type="text" placeholder="Ex.: Amanda Ribeiro" autocomplete="name">
						</div>
						<div class="field" id="fieldEmail">
							<label for="email">E-mail</label>
							<input id="email" type="email" placeholder="voce@empresa.com" autocomplete="email" required>
						</div>
						<div class="field">
							<label for="password" id="passwordLabel">Senha</label>
							<div class="input-wrap">
								<input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
								<button type="button" class="toggle-visibility" id="togglePw">mostrar</button>
							</div>
						</div>
						<div class="field" id="fieldConfirmPassword" style="display:none">
							<label for="confirmPassword">Confirmar nova senha</label>
							<input id="confirmPassword" type="password" placeholder="••••••••" autocomplete="new-password" minlength="6">
						</div>
						<div class="row-between" id="rowBetween">
							<label class="remember"><input type="checkbox" id="remember"> Lembrar de mim</label>
							<a href="#" id="forgotLink">Esqueceu a senha?</a>
						</div>
						<button type="submit" class="primary" id="submitBtn">
							<span class="spinner"></span><span class="btn-label">Entrar</span>
						</button>
					</form>

					<p class="setup-note" id="setupNote"></p>
				</div>

				<div class="success-view" id="successView">
					<div class="success-icon">✓</div>
					<h1>Conta criada!</h1>
					<p id="successMessage">Enviamos um e-mail de confirmação pra você. Abre a caixa de entrada, confirma o cadastro e depois volta aqui pra entrar.</p>
					<a href="#" class="primary" id="backToLogin">Voltar para o login</a>
				</div>
			</div>
		</section>

		<aside class="hero-side">
			<div class="carousel" id="carousel"></div>
			<div class="hero-glow"></div>
			<div class="hero-top"><a class="support-link" href="#">🎧 Suporte</a></div>
			<div class="carousel-dots" id="carouselDots"></div>
		</aside>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
	<script>
	async function initAuth() {
		// URL/chave publica vem sempre do backend (backend/.env) — mesma origem da pagina,
		// entao funciona local ou em producao sem configuracao nenhuma no navegador.
		let SUPABASE_URL = '';
		let SUPABASE_ANON_KEY = '';
		try {
			const response = await fetch((window.MAGIC_INDOOR_API_BASE || '') + '/api/config');
			if (response.ok) {
				const config = await response.json();
				SUPABASE_URL = config.supabaseUrl;
				SUPABASE_ANON_KEY = config.supabaseAnonKey;
			}
		} catch { /* backend fora do ar */ }

		const configured = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);
		const authClient = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

		const setupNote = document.getElementById('setupNote');
		if (!configured) setupNote.textContent = 'Não foi possível conectar ao servidor. Tente novamente em instantes.';

		let mode = 'signin';
		const formTitle = document.getElementById('formTitle');
		const formSubtitle = document.getElementById('formSubtitle');
		const toggleMode = document.getElementById('toggleMode');
		const submitBtn = document.getElementById('submitBtn');
		const btnLabel = submitBtn.querySelector('.btn-label');
		const formError = document.getElementById('formError');
		const formNote = document.getElementById('formNote');
		const fieldName = document.getElementById('fieldName');
		const fieldEmail = document.getElementById('fieldEmail');
		const fieldConfirmPassword = document.getElementById('fieldConfirmPassword');
		const rowBetween = document.getElementById('rowBetween');
		const passwordLabel = document.getElementById('passwordLabel');
		const authView = document.getElementById('authView');
		const successView = document.getElementById('successView');

		function showSuccessView(email) {
			document.getElementById('successMessage').textContent =
				`Enviamos um e-mail de confirmação para ${email}. Abre a caixa de entrada, confirma o cadastro e depois volta aqui pra entrar.`;
			authView.style.display = 'none';
			successView.classList.add('visible');
		}
		document.getElementById('backToLogin').addEventListener('click', e => {
			e.preventDefault();
			successView.classList.remove('visible');
			authView.style.display = '';
			document.getElementById('authForm').reset();
			setMode('signin');
		});

		function setMode(next) {
			mode = next;
			const signIn = mode === 'signin';
			const signUp = mode === 'signup';
			const reset = mode === 'reset';

			formTitle.textContent = signIn ? 'Entrar' : signUp ? 'Criar conta' : 'Defina sua nova senha';
			formSubtitle.innerHTML = reset
				? 'Escolha uma nova senha para sua conta.'
				: signIn
					? 'Não tem uma conta? <a href="#" id="toggleMode">Criar agora</a>'
					: 'Já tem uma conta? <a href="#" id="toggleMode">Entrar</a>';
			btnLabel.textContent = signIn ? 'Entrar' : signUp ? 'Criar conta' : 'Salvar nova senha';
			fieldName.style.display = signUp ? '' : 'none';
			fieldEmail.style.display = reset ? 'none' : '';
			document.getElementById('email').required = !reset;
			fieldConfirmPassword.style.display = reset ? '' : 'none';
			document.getElementById('confirmPassword').required = reset;
			rowBetween.style.display = reset ? 'none' : '';
			passwordLabel.textContent = reset ? 'Nova senha' : 'Senha';
			document.getElementById('password').placeholder = reset ? 'Mínimo 6 caracteres' : '••••••••';
			if (!reset) {
				const toggle = document.getElementById('toggleMode');
				if (toggle) toggle.addEventListener('click', e => { e.preventDefault(); setMode(signIn ? 'signup' : 'signin'); });
			}
			formError.classList.remove('visible');
			formNote.classList.remove('visible');
		}
		toggleMode.addEventListener('click', e => { e.preventDefault(); setMode('signup'); });

		document.getElementById('togglePw').addEventListener('click', () => {
			const pw = document.getElementById('password');
			const btn = document.getElementById('togglePw');
			const show = pw.type === 'password';
			pw.type = show ? 'text' : 'password';
			btn.textContent = show ? 'ocultar' : 'mostrar';
		});

		document.getElementById('forgotLink').addEventListener('click', async e => {
			e.preventDefault();
			if (!configured) { showError('Não foi possível conectar ao servidor.'); return; }
			const email = document.getElementById('email').value.trim();
			if (!email) { showError('Informe seu e-mail para receber o link de recuperação.'); return; }
			const { error } = await authClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/login' });
			if (error) showError(error.message);
			else showNote('Enviamos um link de recuperação para ' + email + '. Abra o e-mail e clique no link para definir uma nova senha.');
		});

		function showError(message) { formError.textContent = message; formError.classList.add('visible'); formNote.classList.remove('visible'); }
		function showNote(message) { formNote.textContent = message; formNote.classList.add('visible'); formError.classList.remove('visible'); }

		function setLoading(loading) {
			submitBtn.disabled = loading;
			submitBtn.classList.toggle('loading', loading);
		}

		document.getElementById('authForm').addEventListener('submit', async e => {
			e.preventDefault();
			if (!configured) { showError('Não foi possível conectar ao servidor.'); return; }
			const password = document.getElementById('password').value;
			formError.classList.remove('visible');
			setLoading(true);
			try {
				if (mode === 'reset') {
					const confirmPassword = document.getElementById('confirmPassword').value;
					if (password !== confirmPassword) throw new Error('As senhas não coincidem.');
					const { error } = await authClient.auth.updateUser({ password });
					if (error) throw error;
					window.location.href = '/';
					return;
				}
				const email = document.getElementById('email').value.trim();
				if (mode === 'signin') {
					const { error } = await authClient.auth.signInWithPassword({ email, password });
					if (error) throw error;
					window.location.href = '/';
				} else {
					const name = document.getElementById('name').value.trim();
					const { error } = await authClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
					if (error) throw error;
					showSuccessView(email);
				}
			} catch (err) {
				showError(err.message || 'Não foi possível concluir. Tente novamente.');
			} finally {
				setLoading(false);
			}
		});

		// O link do e-mail de recuperação abre esta pagina ja autenticado numa sessao
		// temporaria de recuperacao; troca o formulario para pedir a nova senha.
		authClient.auth.onAuthStateChange((event) => {
			if (event === 'PASSWORD_RECOVERY') setMode('reset');
		});

		// Se já existe sessão válida (e não é um link de recuperação), pula direto pro painel.
		if (configured && !window.location.hash.includes('type=recovery')) {
			authClient.auth.getSession().then(({ data }) => { if (data.session) window.location.href = '/'; });
		}
	}
	initAuth();

	// Carrossel de fotos de telas Magic Indoor em ambientes reais.
		const CAROUSEL_SLIDES = [
			'assets/carousel/slide-1.jpg',
			'assets/carousel/slide-2.jpg',
			'assets/carousel/slide-3.jpg',
			'assets/carousel/slide-4.jpg',
			'assets/carousel/slide-5.jpg',
		];
		const carousel = document.getElementById('carousel');
		const carouselDots = document.getElementById('carouselDots');
		CAROUSEL_SLIDES.forEach((src, i) => {
			const slide = document.createElement('div');
			slide.className = 'carousel-slide' + (i === 0 ? ' active' : '');
			slide.innerHTML = `<img src="${src}" alt="Tela Magic Indoor em ambiente real">`;
			carousel.append(slide);
			const dot = document.createElement('span');
			if (i === 0) dot.className = 'active';
			carouselDots.append(dot);
		});
		let carouselIndex = 0;
		setInterval(() => {
			const slides = carousel.querySelectorAll('.carousel-slide');
			const dots = carouselDots.querySelectorAll('span');
			slides[carouselIndex].classList.remove('active');
			dots[carouselIndex].classList.remove('active');
			carouselIndex = (carouselIndex + 1) % CAROUSEL_SLIDES.length;
			slides[carouselIndex].classList.add('active');
			dots[carouselIndex].classList.add('active');
		}, 4500);
	</script>
</body>
</html>
